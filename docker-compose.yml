services:
  api:
    build: ./api
    container_name: estudo-api
    restart: unless-stopped
    environment:
      - JWT_SECRET=${JWT_SECRET:-}
      - CORS_ORIGIN=${CORS_ORIGIN:-}
      - ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-true}
      - PORT=4000
      - DATABASE_PATH=/app/data/data.db
    volumes:
      - estudo-data:/app/data
    ports:
      - "4000:4000"

  web:
    build:
      context: ./web
      args:
        VITE_API_URL: /api
    container_name: estudo-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  estudo-data:
